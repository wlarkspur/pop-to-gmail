name: 식대 (새 달 시트)

on:
  schedule:
    - cron: "0 6 1-3 * *"   # 매월 1~3일 08:00 (칼리닌그라드). 이미 있으면 그냥 끝남
  workflow_dispatch:
    inputs:
      month:
        description: "만들 달 (예: 2026-11). 비우면 이번 달"
        required: false
      dry_run:
        description: "시험 실행 (파일에 안 쓰고 메일도 안 보냄)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pay-files
  cancel-in-progress: false

jobs:
  meal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 패키지
        run: pip install -q xlrd==2.0.1 olefile==0.47 google-auth==2.35.0 requests==2.32.3 openpyxl==3.1.5
      - name: 식대 시트
        run: python3 meal_job.py ${{ github.event.inputs.month }}
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
