name: 가마감용 Daily Report (월초)

on:
  workflow_dispatch:
    inputs:
      month:
        description: "대상 월 (예: 2026-10). 비우면 지난달"
        required: false
      entity:
        description: "HAS 또는 YSKD. 비우면 둘 다"
        required: false

permissions:
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q xlrd==2.0.1 olefile==0.47 google-auth==2.35.0 requests==2.32.3 openpyxl==3.1.5
      - run: python3 daily_job.py "${{ github.event.inputs.month }}" "${{ github.event.inputs.entity }}"
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
