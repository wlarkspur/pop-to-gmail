name: 급여환율 (x-rates → 환율!.xls)

on:
  # 예약 실행은 시계(tick.yml)가 기준일에만 08:00~12:00 30분마다 부름 (자체 schedule은 GitHub 지연으로 엉뚱한 시각에 돌아서 뺌)
  workflow_dispatch:
    inputs:
      date:
        description: "기준일로 볼 날짜 (예: 2026-11-03). 비우면 오늘"
        required: false
      dry_run:
        description: "시험 실행 (파일에 안 쓰고 메일도 안 보냄)"
        type: boolean
        default: false
      pay:
        description: "시험용 지급일 (예: 2026-11-10). 비우면 달력대로"
        required: false
      rebuild_notice:
        description: "이미 기록된 날이라도 제어판 대기 공지를 새 양식으로 다시 만듦 (발송된 건은 그대로)"
        type: boolean
        default: false
      preview_test:
        description: "시험 실행 때 공지 확인 메일(테스트 표시, 발송 안 됨)을 나에게 보냄"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fx-cbr      # 환율 작업과 같은 파일을 쓰므로 동시에 돌지 않게
  cancel-in-progress: false

jobs:
  salary:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지
        run: |
          pip install -q xlrd==2.0.1 olefile==0.47 google-auth==2.35.0 requests==2.32.3 openpyxl==3.1.5 playwright==1.48.0 pillow==11.0.0
          python -m playwright install --with-deps chromium
      - name: 급여환율
        run: python3 salary_job.py "${{ github.event.inputs.date }}" "${{ github.event.inputs.pay }}"
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          REBUILD_NOTICE: ${{ github.event.inputs.rebuild_notice == 'true' && '1' || '0' }}
          PREVIEW_TEST: ${{ github.event.inputs.preview_test == 'true' && '1' || '0' }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          NOTICE_PASSWORD: ${{ secrets.NOTICE_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: 시험 실행 캡처 보관
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shot_*.png
          if-no-files-found: ignore
      - if: failure()
        run: pip install -q requests==2.32.3 && python3 tg.py --fail "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
