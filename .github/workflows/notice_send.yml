name: 제어판 승인 메일 발송

on:
  schedule:
    - cron: "*/5 5-19 * * *"   # 칼리닌그라드 07~21시, 5분마다 제어판 승인 요청 확인
  workflow_dispatch:
    inputs:
      tg_confirm:
        description: "텔레그램 봇이 넣는 승인 (key|ts|mac) - 직접 쓰지 않음"
        required: false
        default: ""
      tg_cancel:
        description: "텔레그램 봇이 넣는 취소 (key|ts) - 직접 쓰지 않음"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: notice-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 패키지
        run: pip install -q google-auth==2.35.0 requests==2.32.3 xlrd==2.0.1 olefile==0.47
      - name: 승인 요청 처리
        run: python3 notice_queue.py
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          NOTICE_PASSWORD: ${{ secrets.NOTICE_PASSWORD }}
          TG_CONFIRM: ${{ github.event.inputs.tg_confirm }}
          TG_CANCEL: ${{ github.event.inputs.tg_cancel }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          POP_USER: ${{ secrets.POP_USER }}
          POP_PASS: ${{ secrets.POP_PASS }}
      - if: failure()
        run: pip install -q requests==2.32.3 && python3 tg.py --fail "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
