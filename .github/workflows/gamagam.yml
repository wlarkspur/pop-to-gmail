name: HAS 가마감 초안

on:
  workflow_dispatch:
    inputs:
      month:
        description: "대상 월 (예: 2026-10)"
        required: true

permissions:
  contents: read

concurrency:
  group: gamagam
  cancel-in-progress: false

jobs:
  gamagam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q xlrd==2.0.1 olefile==0.47 google-auth==2.35.0 requests==2.32.3 openpyxl==3.1.5
      - run: python3 gamagam_job.py "${{ github.event.inputs.month }}"
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
