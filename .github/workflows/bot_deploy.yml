name: 텔레그램 봇 배포 (Cloudflare Worker)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["bot/**"]

permissions:
  contents: read

concurrency:
  group: bot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      GH_TOKEN: ${{ secrets.BOT_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 시크릿 확인
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TG_TOKEN TG_CHAT_ID GH_TOKEN; do
            test -n "${!v}" || { echo "시크릿 없음: $v (GH_TOKEN은 BOT_GH_TOKEN)"; exit 1; }
          done
          ws=$(printf '%s' "bot-webhook|$TG_TOKEN" | sha256sum | cut -c1-48)
          echo "::add-mask::$ws"
          echo "WEBHOOK_SECRET=$ws" >> "$GITHUB_ENV"
      - name: 배포 + 봇 시크릿
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          secrets: |
            TG_TOKEN
            TG_CHAT_ID
            GH_TOKEN
            WEBHOOK_SECRET
      - name: 텔레그램 웹훅, 명령 목록 등록
        run: |
          sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c "import sys,json;print((json.load(sys.stdin).get('result') or {}).get('subdomain') or '')")
          test -n "$sub" || { echo "workers.dev 하위 도메인이 없음 - Cloudflare 대시보드에서 Workers 화면을 한 번 열어 만들어 주세요"; exit 1; }
          python3 bot/setup_webhook.py "https://hasbot.$sub.workers.dev"
      - if: failure()
        run: pip install -q requests==2.32.3 && python3 tg.py --fail "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
