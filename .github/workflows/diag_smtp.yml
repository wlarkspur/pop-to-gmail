name: 진단 - 회사 메일 서버 연결

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-auth==2.35.0 requests==2.32.3 xlrd==2.0.1 olefile==0.47
      - name: 로그인만 확인 (메일은 안 보냄)
        env:
          POP_USER: ${{ secrets.POP_USER }}
          POP_PASS: ${{ secrets.POP_PASS }}
        run: |
          python3 -c "
          import salary_notice as n
          s = n.smtp_connect(); print('로그인 성공, 포트', s.sock.getpeername()[1]); s.quit()
          "
